[project]
name = "jobpilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite",
  "litellm",
  "instructor>=1.4",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel",
  "httpx>=0.27",
  "selectolax",
  "extruct",
  "pdfplumber",
  "rapidfuzz>=3",
  "jinja2>=3.1",
  "apscheduler>=3.10,<4",
  "python-telegram-bot>=21",
  "imap-tools>=1.5",
  "python-dotenv",
  "keyring",
  "cryptography",
  "structlog",
  "langfuse",
  "typer>=0.12",
  "rich",
  "streamlit",
  "playwright>=1.45",
  "pyyaml",
  "tenacity",
  "reportlab",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "pytest-playwright",
       "ruff", "mypy", "types-PyYAML", "pre-commit"]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits real websites (never run in CI)"]